server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 512;

    # Single-file app: every route just serves index.html.
    location / {
        try_files $uri /index.html;
    }

    # index.html changes with every release — never let a browser cache it.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
